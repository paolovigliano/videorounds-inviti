<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videorounds RSVP</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  min-height:100vh;
  background:
    linear-gradient(rgba(244,235,218,.82), rgba(244,235,218,.88)),
    url('https://images.unsplash.com/photo-1552832230-c0197dd311b5?auto=format&fit=crop&w=1800&q=80');
  background-size:cover;
  background-position:center;
  font-family:'Playfair Display', serif;
  color:#3f2d24;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:32px 14px;
  box-sizing:border-box;
}

.card{
  width:100%;
  max-width:520px;
  background:rgba(252,246,234,.94);
  border:2px solid rgba(160,120,62,.45);
  border-radius:28px;
  padding:34px 34px 30px;
  text-align:center;
  box-shadow:0 18px 55px rgba(50,30,15,.22);
  box-sizing:border-box;
}

.logo{
  width:340px;
  max-width:92%;
  display:block;
  margin:0 auto 26px;
}

.line{
  width:130px;
  height:1px;
  background:#b89555;
  margin:0 auto 18px;
}

.roma{
  font-family:'Cinzel', serif;
  font-size:13px;
  letter-spacing:4px;
  color:#9a7446;
  margin-bottom:12px;
}

.invito{
  font-size:19px;
  color:#6f5140;
  margin-bottom:10px;
}

.name{
  font-family:'Cinzel', serif;
  font-size:42px;
  line-height:1.12;
  color:#5c171b;
  margin:0 0 20px;
}

.reserved{
  font-size:25px;
  line-height:1.35;
  margin:0 0 24px;
  color:#3f2d24;
}

.details{
  font-size:19px;
  line-height:1.75;
  margin-bottom:22px;
  color:#4b3a30;
}

.exclusive{
  font-size:18px;
  line-height:1.65;
  margin-bottom:22px;
  color:#4b3a30;
}

.badge{
  display:inline-block;
  padding:10px 22px;
  border:1px solid #b89555;
  border-radius:999px;
  background:#f5ead7;
  font-family:'Cinzel', serif;
  font-size:14px;
  letter-spacing:1.8px;
  color:#6d3a2b;
  margin-bottom:24px;
}

.btn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:17px 16px;
  font-size:18px;
  font-family:Arial, sans-serif;
  cursor:pointer;
  margin-top:12px;
  transition:.18s;
}

.btn:hover{
  transform:translateY(-1px);
}

.confirm{
  background:linear-gradient(180deg,#8d2635,#6e1724);
  color:white;
  box-shadow:0 8px 18px rgba(110,23,36,.22);
}

.decline{
  background:#eadcc5;
  color:#5a473a;
}

#messaggio{
  margin-top:24px;
  font-size:18px;
  line-height:1.5;
  font-weight:700;
  color:#2f6f3f;
}

@media(max-width:600px){
  body{padding:18px 10px;}
  .card{padding:28px 22px 26px;}
  .logo{width:300px;}
  .name{font-size:31px;}
  .reserved{font-size:22px;}
  .details,.exclusive{font-size:17px;}
}
</style>
</head>

<body>

<div class="card">

  <img src="logo.png" class="logo">

  <div class="line"></div>

  <div class="roma">ROMA</div>

  <div class="invito">Invito riservato a</div>

  <h1 class="name" id="nome">OSPITE</h1>

  <p class="reserved">Ti abbiamo riservato un posto.</p>

  <div class="line"></div>

  <div class="details">
    📍 Clivio di Scauro 4 – Roma<br>
    🕒 10 giugno 2026 – ore 19:30
  </div>

  <div class="exclusive">
    Evento a numero chiuso<br>
    Ingresso solo su invito
  </div>

  <div class="badge" id="badge">N. INVITO 001</div>

  <button class="btn confirm" onclick="inviaRisposta('SI')">
    Confermo la mia presenza
  </button>

  <button class="btn decline" onclick="inviaRisposta('NO')">
    Non riesco a partecipare
  </button>

  <div id="messaggio"></div>

</div>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbweBxVq54HnRRhPImUrePADwvE1IV_zccMFyYMQxyRwg0Cv_06FqT3au4rp6J5olyUF/exec";

const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "001";
const nome = params.get("nome") || "OSPITE";

document.getElementById("nome").innerText = nome.toUpperCase();
document.getElementById("badge").innerText = "N. INVITO " + id;

function inviaRisposta(risposta){
  document.getElementById("messaggio").innerHTML = "Registrazione in corso...";

  fetch(scriptURL,{
    method:"POST",
    body:JSON.stringify({
      id:id,
      nome:nome,
      risposta:risposta
    })
  })
  .then(r=>r.json())
  .then(data=>{
    if(risposta==="SI"){
      document.getElementById("messaggio").innerHTML =
        "✅ Presenza confermata.<br>Ti aspettiamo il 10 giugno.";
    }else{
      document.getElementById("messaggio").innerHTML =
        "Risposta registrata.<br>Grazie per il riscontro.";
    }
  })
  .catch(error=>{
    document.getElementById("messaggio").innerHTML =
      "Errore durante la registrazione. Riprova.";
  });
}
</script>

</body>
</html>
