<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videorounds RSVP</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>

body{

    margin:0;
    padding:0;

    background:
    linear-gradient(rgba(245,238,226,0.92), rgba(245,238,226,0.92)),
    url('https://images.unsplash.com/photo-1529260830199-42c24126f198?q=80&w=1600&auto=format&fit=crop');

    background-size:cover;
    background-position:center;

    font-family:'Playfair Display', serif;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    min-height:100vh;

    color:#3b2a22;

    padding:40px 20px;
}

.card{

    width:100%;
    max-width:520px;

    background:#f8f1e6;

    border:2px solid #c7a66a;

    border-radius:24px;

    padding:35px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,0.18);

    position:relative;
}

.logo{

    width:280px;
    margin:0 auto 10px auto;
    display:block;
}

.subtitle{

    font-size:13px;
    letter-spacing:3px;
    color:#7b1e1e;
    margin-top:10px;
    margin-bottom:25px;
}

.invito{

    font-size:18px;
    color:#6d4c41;
    margin-bottom:8px;
}

.nome{

    font-family:'Cinzel', serif;
    font-size:42px;
    font-weight:700;
    color:#5b1414;

    margin-bottom:18px;
}

.riservato{

    font-size:24px;
    color:#6b1e1e;

    margin-bottom:30px;
}

.info{

    font-size:19px;
    line-height:1.9;

    margin-bottom:30px;
}

.numero{

    display:inline-block;

    background:#f0dfbf;

    border:1px solid #c7a66a;

    border-radius:12px;

    padding:10px 20px;

    margin-bottom:28px;

    font-weight:bold;

    color:#7b1e1e;

    font-size:18px;
}

button{

    width:100%;

    padding:18px;

    border:none;

    border-radius:14px;

    margin-top:14px;

    font-size:18px;

    cursor:pointer;

    transition:0.2s;
}

.si{

    background:#7b1e1e;
    color:white;
}

.no{

    background:#e6d6b8;
    color:#3a2a22;
}

button:hover{

    transform:scale(1.02);
}

.footerLogo{

    width:230px;
    margin-top:30px;
    margin-bottom:10px;
}

.confirmed{

    margin-top:20px;
    font-size:18px;
    color:#2e7d32;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<img class="logo" src="https://i.imgur.com/VnV9K8M.jpeg">

<div class="subtitle">
ROMA
</div>

<div class="invito">
Invito riservato a
</div>

<div class="nome" id="nome">
Ospite
</div>

<div class="riservato">
Ti abbiamo riservato un posto.
</div>

<div class="info">

📍 Clivio di Scauro 4 – Roma<br>
🕒 10 giugno 2026 – ore 19:30<br><br>

Evento a numero chiuso<br>
Ingresso solo su invito

</div>

<div class="numero" id="numeroInvito">
N. INVITO 007
</div>

<button class="si" onclick="inviaRisposta('SI')">
Confermo la mia presenza
</button>

<button class="no" onclick="inviaRisposta('NO')">
Non riesco a partecipare
</button>

<img class="footerLogo" src="https://i.imgur.com/VnV9K8M.jpeg">

<div class="confirmed" id="messaggio"></div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbweBxVq54HnRRhPImUrePADwvE1IV_zccMFyYMQxyRwg0Cv_06FqT3au4rp6J5olyUF/exec";

const params = new URLSearchParams(window.location.search);

const nome = params.get("nome") || "Ospite";
const id = params.get("id") || "000";

document.getElementById("nome").innerText = nome;

document.getElementById("numeroInvito").innerText =
"N. INVITO " + id;

function inviaRisposta(risposta){

    document.getElementById("messaggio").innerHTML =
    "Registrazione in corso...";

    fetch(scriptURL, {

        method:"POST",

        body:JSON.stringify({

            id:id,
            nome:nome,
            risposta:risposta

        })

    })

    .then(response => response.json())

    .then(data => {

        if(risposta === "SI"){

            document.getElementById("messaggio").innerHTML =
            "✅ Presenza confermata. Ti aspettiamo il 10 giugno.";

        }else{

            document.getElementById("messaggio").innerHTML =
            "Risposta registrata. Grazie per il riscontro.";

        }

    })

    .catch(error => {

        document.getElementById("messaggio").innerHTML =
        "Errore durante la registrazione.";

    });

}

</script>

</body>
</html>
