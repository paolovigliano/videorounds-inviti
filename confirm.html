<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videorounds RSVP</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>

body{

margin:0;
padding:0;

background:
linear-gradient(rgba(245,238,226,0.92), rgba(245,238,226,0.92)),
url('https://images.unsplash.com/photo-1529268308199-42c4126f198?auto=format&fit=crop&w=1600&q=80');

background-size:cover;
background-position:center;

font-family:'Playfair Display', serif;

display:flex;
justify-content:center;
align-items:flex-start;

min-height:100vh;

padding:40px 20px;

box-sizing:border-box;
}

.card{

width:100%;
max-width:520px;

background:rgba(255,252,248,0.92);

border:1px solid rgba(120,90,70,0.18);

border-radius:26px;

padding:38px;

box-shadow:
0 12px 40px rgba(0,0,0,0.14),
0 2px 12px rgba(0,0,0,0.06);

backdrop-filter:blur(5px);

text-align:center;
}

.logo{
width:320px;
max-width:92%;
margin-bottom:12px;
}

.roma{

font-family:'Cinzel', serif;
font-size:13px;
letter-spacing:3px;
color:#9d7b63;

margin-top:4px;
margin-bottom:18px;
}

.invito{

font-size:20px;
color:#7d5d48;
margin-bottom:10px;
}

h1{

font-family:'Cinzel', serif;

font-size:44px;

line-height:1.1;

margin:0 0 18px 0;

color:#5b3a2d;
}

.subtitle{

font-size:28px;

line-height:1.4;

color:#5c5148;

margin-bottom:28px;
}

.info{

font-size:19px;
line-height:1.9;
color:#6f6258;

margin-bottom:28px;
}

.middle{

font-size:18px;
line-height:1.8;
color:#6a5c52;

margin-bottom:26px;
}

.badge{

display:inline-block;

padding:10px 18px;

border:1px solid #c8b39f;

border-radius:40px;

font-size:14px;

letter-spacing:1px;

color:#7c5c46;

background:#f8f1ea;

margin-bottom:28px;
}

.btn{

width:100%;

padding:18px;

border:none;

border-radius:14px;

font-size:18px;

cursor:pointer;

margin-bottom:14px;

transition:0.2s;
}

.btn:hover{
transform:translateY(-1px);
}

.yes{

background:#8c3046;
color:white;
}

.no{

background:#ece3d7;
color:#6b5a4c;
}

#messaggio{

margin-top:24px;

font-size:18px;

font-weight:bold;

color:#2f6b3d;
}

@media(max-width:600px){

.card{
padding:28px 22px;
}

h1{
font-size:32px;
}

.subtitle{
font-size:22px;
}

.info{
font-size:17px;
}

}

</style>

</head>

<body>

<div class="card">

<img class="logo"
src="https://paolovigliano.github.io/videorounds-inviti/logo.png">

<div class="roma">ROMA</div>

<div class="invito">Invito riservato a</div>

<h1 id="nome">OSPITE</h1>

<p class="subtitle">
Ti abbiamo riservato un posto.
</p>

<div class="info">

<div>📍 Clivio di Scauro 4 – Roma</div>

<div>🕒 10 giugno 2026 – ore 19:30</div>

</div>

<div class="middle">

Evento a numero chiuso<br>
Ingresso solo su invito

</div>

<div class="badge" id="badgeInvito">
N. INVITO 001
</div>

<button class="btn yes" onclick="inviaRisposta('SI')">
Confermo la mia presenza
</button>

<button class="btn no" onclick="inviaRisposta('NO')">
Non riesco a partecipare
</button>

<p id="messaggio"></p>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbweBxVq54HnRRhPImUrePADwvE1IV_zccMFyYMQxyRwg0Cv_06FqT3au4rp6J5olyUF/exec";

const params = new URLSearchParams(window.location.search);

const id = params.get("id") || "000";
const nome = params.get("nome") || "OSPITE";

document.getElementById("nome").innerText = nome.toUpperCase();

document.getElementById("badgeInvito").innerText =
"N. INVITO " + id;

function inviaRisposta(risposta){

fetch(scriptURL,{

method:"POST",

body:JSON.stringify({
id:id,
nome:nome,
risposta:risposta
})

})

.then(response => response.json())

.then(data => {

if(risposta==="SI"){

document.getElementById("messaggio").innerHTML =
"✅ Presenza confermata. Ti aspettiamo il 10 giugno.";

}else{

document.getElementById("messaggio").innerHTML =
"Risposta registrata. Grazie per il riscontro.";

}

})

.catch(error => {

document.getElementById("messaggio").innerHTML =
"Errore durante la registrazione.";

});

}

</script>

</body>
</html>
