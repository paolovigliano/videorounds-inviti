<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videorounds RSVP</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
padding:0;

background:
linear-gradient(rgba(245,238,226,0.92), rgba(245,238,226,0.92)),
url('https://images.unsplash.com/photo-1529268308199-42c4126f198?auto=format&fit=crop&w=1600&q=80');

background-size:cover;
background-position:center;

font-family:'Playfair Display', serif;

display:flex;
justify-content:center;
align-items:flex-start;

min-height:100vh;

color:#3b2b2b;
}

.card{

width:420px;
max-width:92%;

background:rgba(255,250,245,0.92);

margin:40px 0;

padding:40px 35px;

border-radius:26px;

box-shadow:0 10px 40px rgba(0,0,0,0.15);

border:1px solid rgba(120,80,60,0.15);

text-align:center;

backdrop-filter:blur(6px);
}

.logo{
width:220px;
margin:0 auto 30px auto;
display:block;
}

.city{
font-size:13px;
letter-spacing:3px;
margin-bottom:8px;
color:#8b6b5c;
}

.subtitle{
font-size:15px;
margin-bottom:18px;
}

.name{
font-size:46px;
font-weight:700;
margin-bottom:20px;
line-height:1.1;
}

.text{
font-size:22px;
margin-bottom:26px;
}

.details{
font-size:18px;
line-height:1.8;
margin-bottom:30px;
}

.badge{

display:inline-block;

padding:10px 22px;

border:1px solid #c6a98b;

border-radius:999px;

font-size:14px;

letter-spacing:2px;

margin-bottom:30px;

background:#f7efe8;
}

.btn{

width:100%;

padding:18px;

border:none;

border-radius:14px;

font-size:18px;

cursor:pointer;

margin-top:12px;

transition:0.2s;
}

.confirm{
background:#8d3c4e;
color:white;
}

.confirm:hover{
opacity:0.9;
}

.decline{
background:#efe7dc;
color:#5a4b44;
}

#messaggio{
margin-top:24px;
font-size:18px;
font-weight:600;
}

</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="logo">

<div class="city">ROMA</div>

<div class="subtitle">
Invito riservato a
</div>

<div class="name" id="nome">
OSPITE
</div>

<div class="text">
Ti abbiamo riservato un posto.
</div>

<div class="details">
📍 Clivio di Scauro 4 – Roma<br>
🕒 10 giugno 2026 – ore 19:30<br><br>

Evento a numero chiuso<br>
Ingresso solo su invito
</div>

<div class="badge" id="badge">
N. INVITO 001
</div>

<button class="btn confirm" onclick="inviaRisposta('SI')">
Confermo la mia presenza
</button>

<button class="btn decline" onclick="inviaRisposta('NO')">
Non riesco a partecipare
</button>

<div id="messaggio"></div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbweBxVq54HnRRhPImUrePADwvE1IV_zccMFyYMQxyRwg0Cv_06FqT3au4rp6J5olyUF/exec";

const params = new URLSearchParams(window.location.search);

const id = params.get("id") || "001";
const nome = params.get("nome") || "OSPITE";

document.getElementById("nome").innerText = nome.toUpperCase();

document.getElementById("badge").innerText =
"N. INVITO " + id;

function inviaRisposta(risposta){

fetch(scriptURL,{

method:"POST",

body:JSON.stringify({
id:id,
nome:nome,
risposta:risposta
})

})

.then(r=>r.json())

.then(data=>{

if(risposta==="SI"){

document.getElementById("messaggio").innerHTML =
"✅ Presenza confermata. Ti aspettiamo il 10 giugno.";

}else{

document.getElementById("messaggio").innerHTML =
"Risposta registrata. Grazie per il riscontro.";

}

})

.catch(error=>{

document.getElementById("messaggio").innerHTML =
"Errore durante la registrazione.";

});

}

</script>

</body>
</html>
